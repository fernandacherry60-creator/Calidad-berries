name: APK Calidad Berries Pro
on:
  workflow_dispatch:
  push:
    branches: [feature/paneles-admin-trabajador-20261117]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: calidad-berries-pro-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
