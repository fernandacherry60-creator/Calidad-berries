name: Validación Calidad Berries Pro
on:
  workflow_dispatch:
  push:
    branches: [feature/paneles-admin-trabajador-20261117]
concurrency:
  group: calidad-berries-pro-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
