name: Expo TypeScript check
on:
  push:
    branches: [main]
    paths:
      - 'expo/**'
      - '.github/workflows/expo-typecheck.yml'
  pull_request:
    paths:
      - 'expo/**'
      - '.github/workflows/expo-typecheck.yml'
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
