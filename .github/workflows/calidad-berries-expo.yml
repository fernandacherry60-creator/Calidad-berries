name: Expo Calidad Berries Pro - validación
on:
  workflow_dispatch:
  push:
    branches: [main, feature/paneles-admin-trabajador-20261117]
    paths:
      - 'expo/**'
      - '.github/workflows/calidad-berries-expo.yml'
permissions:
  contents: read
concurrency:
  group: expo-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias con lockfile
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Comprobar Expo Doctor
        run: npx expo-doctor
      - name: Comprobar Expo config y EAS projectId
        run: |
          npx expo config --type public
          npx expo config --json | node -e "let s='';process.stdin.on('data',x=>s+=x);process.stdin.on('end',()=>{const c=JSON.parse(s);if(c.extra?.eas?.projectId!=='4ced7997-9a09-4962-b3d5-222d923b0287')process.exit(1)})"
