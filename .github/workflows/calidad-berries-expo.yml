name: Expo Calidad Berries Pro - validación
on:
  workflow_dispatch:
  push:
    branches: [main, feature/paneles-admin-trabajador-20261117]
    paths:
      - 'expo/**'
      - '.github/workflows/calidad-berries-expo.yml'
permissions:
  contents: write
concurrency:
  group: expo-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar lockfile reproducible
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Guardar package-lock.json en main
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- expo/package-lock.json || [ ! -f expo/package-lock.json ] || ! git ls-files --error-unmatch expo/package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add expo/package-lock.json
            git diff --cached --quiet || git commit -m 'chore(expo): commit npm lockfile for EAS and Expo Doctor'
            git push origin HEAD:main
          fi
        working-directory: .
      - name: Instalar dependencias con lockfile
        run: npm ci --no-audit --no-fund
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Comprobar Expo
        run: npx expo config --type public
