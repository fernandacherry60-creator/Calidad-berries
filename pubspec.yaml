name: calidad_berries
description: Aseguramiento de calidad de berries. Captura offline de muestreos de anden, fruta proceso y semaforizacion de riesgos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.8.3
  path_provider: ^2.1.4
  provider: ^6.1.1
  crypto: ^3.0.3
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  fl_chart: ^0.66.2
  supabase_flutter: ^2.8.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FDF6F3"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
